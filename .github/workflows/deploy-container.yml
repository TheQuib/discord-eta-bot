name: Build and Push discord-eta-bot image

on:
  push:
    branches:
      - main
    tags:
      - '*'
    paths:
      - 'Dockerfile'
      - '.github/workflows/deploy-container.yml'
      - 'docker-compose.yml'
      - 'cogs/**'
      - 'database/**'
      - bot.py
      - Dockerfile
      - 'requirements.txt'
      - 'version.txt'
      - 'CHANGELOG.md'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: linux/amd64,linux/arm64,linux/arm/v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version number
        id: get_version
        run: |
          VERSION=$(cut -d '=' -f2 version.txt | tr -d '[:space:]')
          echo "VERSION=$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
        shell: bash

      - name: Check if tag already exists
        id: tag_exists
        run: |
          if git rev-parse "v${{ env.VERSION }}" >/dev/null 2>&1; then
            echo "::set-output name=found::true"
            echo "Tag v${{ env.VERSION }} already exists."
          else
            echo "::set-output name=found::false"
            echo "Tag v${{ env.VERSION }} does not exist."
          fi

      - name: Build and push Docker image
        if: steps.tag_exists.outputs.found != 'true'
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: |
            ghcr.io/thequib/discord-eta-bot:latest
            ghcr.io/thequib/discord-eta-bot:${{ env.VERSION }}
            ghcr.io/thequib/discord-eta-bot:${{ github.sha }}
